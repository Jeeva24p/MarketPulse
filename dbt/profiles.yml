marketpulse:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GCP_SA_KEY_PATH', '/tmp/marketpulse-sa.json') }}"
      project_id: "{{ env_var('GCP_PROJECT_ID', 'your-gcp-project-id') }}"
      # `database` is BigQuery's alias for `project_id`. It must be set
      # explicitly: when it is omitted dbt-bigquery injects the local ADC
      # default project, which then overrides `project_id`.
      database: "{{ env_var('GCP_PROJECT_ID', 'your-gcp-project-id') }}"
      dataset: marketpulse_analytics
      threads: 4
    prod:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GCP_SA_KEY_PATH', '/tmp/marketpulse-sa.json') }}"
      project_id: "{{ env_var('GCP_PROJECT_ID', 'your-gcp-project-id') }}"
      database: "{{ env_var('GCP_PROJECT_ID', 'your-gcp-project-id') }}"
      dataset: marketpulse_analytics
      threads: 4

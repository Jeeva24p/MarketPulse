version: 2

models:
  - name: dim_assets
    description: "Gold-layer asset dimension: one row per unique ticker."
    columns:
      - name: ticker
        data_tests:
          - unique
          - not_null
      - name: asset_class
        data_tests:
          - not_null

  - name: fact_daily_metrics
    description: >-
      Gold-layer daily fact table (grain: ticker + trade_date) enriched with
      engineered features from the intermediate layer.
    data_tests:
      - relationships:
          arguments:
            column_name: ticker
            to: ref('dim_assets')
            field: ticker
    columns:
      - name: ticker
        data_tests:
          - not_null
      - name: trade_date
        data_tests:
          - not_null
      - name: close_price
        data_tests:
          - not_null
      - name: volume
        data_tests:
          - not_null
